# Copy this file to config/config.yaml and replace every example path.

# Inputs and output
genome: "/absolute/path/to/genome.fa"
output_dir: "results"
database_name: "species_RMdb"
species_name: "Genus_species"

# Any taxon understood by the installed Dfam/FamDB release, for example
# "Aves", "Mammalia", "Actinopterygii", "Viridiplantae", or a species name.
taxon: "Aves"

# Optional; defaults to <species>_combined_curated_<taxon>.fa
# final_library_name: "Genus_species_combined_repeats.fa"

# External data. All executable software, including famdb.py and the
# RepeatMasker utilities, is supplied by the rule-specific Conda environments.
# This directory contains the downloaded Dfam .h5 root and all curated-
# consensus partition files required by RepeatModeler 2.0.9.
famdb_dir: "/absolute/path/to/dfam/FamDB"
# Uncompressed protein FASTA; see "Download the protein database" in README.md.
protein_db: "/absolute/path/to/uniprot_sprot.fasta"

# Optional branches. RepeatModeler already performs structural LTR discovery by
# default. Enable the separate LTR_retriever branch only for an additional,
# independent structural search.
repeatmodeler_ltr_struct: true
run_ltr_retriever: false
run_trf: true
generate_landscape: true

# Recommended for production libraries. TEtrimmer rebuilds RepeatModeler
# consensuses from genomic copies and helps remove composite boundaries.
# It is optional because it adds a substantial curation step and may download
# Pfam data on first use.
run_tetrimmer: true
# Set this when compute nodes cannot download the Pfam database automatically.
# tetrimmer_pfam_dir: "/absolute/path/to/pfam"

# Reviewed RepeatModeler family names to remove before TEtrimmer and all
# downstream library construction. Keep this species-specific list in the
# analysis config; do not edit generated FASTA files by hand.
exclude_families: []

# TEtrimmer can rename or split input families. Use this second list for names
# found in TEtrimmer_consensus_merged.fasta (or in the library used when
# run_tetrimmer is false).
exclude_curated_families: []

# Stop when one de novo family accounts for an unusually large fraction of the genome.
# A flagged family is never deleted automatically: inspect it, then either add
# a confirmed artifact to exclude_families or a validated biological expansion
# to allow_high_coverage_families.
family_qc:
  max_genome_percent_per_family: 5.0
  fail_on_excess: true
  allow_high_coverage_families: []

# TRF is serial. The genome is divided into this many balanced FASTA chunks;
# sequence records are never broken, so BED coordinates remain unchanged.
# Increase for fragmented assemblies or larger clusters; maximum 256.
trf_chunks: 32
trf_parameters:
  match: 2
  mismatch: 5
  delta: 7
  pm: 80
  pi: 10
  minscore: 50
  maxperiod: 2000

# CD-HIT thresholds
cdhit_identity_2d: 0.90
cdhit_coverage_2d: 0.80
cdhit_identity_self: 0.80
cdhit_coverage_self: 0.80

# Cluster resources. Partition names and limits are site-specific.
resources:
  repeatmodeler:
    threads: 32
    mem_gb: 64
    time: "7-00:00:00"
    partition: "bigmem"
  classify_filter:
    threads: 16
    mem_gb: 64
    time: "2-00:00:00"
    partition: "bigmem"
  tetrimmer:
    threads: 32
    mem_gb: 128
    time: "3-00:00:00"
    partition: "bigmem"
  ltr_retriever:
    threads: 32
    mem_gb: 64
    time: "5-00:00:00"
    partition: "bigmem"
  cdhit:
    threads: 8
    mem_gb: 64
    time: "2-00:00:00"
    partition: "bigmem"
  repeatmasker:
    threads: 64
    mem_gb: 128
    time: "7-00:00:00"
    partition: "bigmem"
  trf:
    # TRF itself is single-threaded; parallelism comes from multiple chunks.
    threads: 1
    mem_gb: 8
    time: "5-00:00:00"
    partition: "standard"
  postprocess:
    threads: 1
    mem_gb: 8
    time: "1-00:00:00"
    partition: "standard"
  light:
    threads: 1
    mem_gb: 4
    time: "01:00:00"
    partition: "standard"
